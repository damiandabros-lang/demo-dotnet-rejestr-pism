# DEMO Isvero Studio – rejestr pism: ASP.NET Core 8 + MS SQL Server 2022.
# Osobna aplikacja Coolify. Domenę przypisz TYLKO do usługi "web" (port 8080).
# Sekrety (SA_PASSWORD, DEMO_PASSWORD) ustaw jako zmienne w Coolify – nie w repo.
services:
  web:
    build: .
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SqlServer: "Server=mssql,1433;Database=RejestrPism;User Id=sa;Password=${SA_PASSWORD:?ustaw SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Demo__Password: ${DEMO_PASSWORD:?ustaw DEMO_PASSWORD}
    expose:
      - "8080"
    deploy:
      resources:
        limits: { memory: 384M, cpus: "1.0" }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?ustaw SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 2G }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  mssql_data:
